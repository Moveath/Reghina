<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Puzzle</title>

    <!-- Анти-мигание при загрузке: пока грузятся css/*.css и js/*.js (это
         несколько отдельных сетевых запросов), страница долю секунды видна
         с дефолтной розовой темой, даже если сохранена другая — на медленной
         сети это заметный "флеш". Это ставит фон синхронно, ДО начала
         загрузки внешних стилей, через !important (побеждает body{background}
         из css/style.css независимо от того, кто из них догрузится раньше) —
         никакого промежуточного "не того" кадра. Список картинок ниже должен
         совпадать с themeOptions в js/ui/settings.js.
         Заодно предзагружает (rel=preload) картинку темы и правильную позу
         собаки (спит — если интро ещё не пройдено, обычная — если да), чтобы
         они начали качаться параллельно с CSS/JS, а не только после того как
         до них дойдёт исполнение settings.js/dog.js. -->
    <script>
    (function(){
        try {
            var THEME_IMAGES = {
                pink:   "images/backgrounds/theme-pink.png",
                purple: "images/backgrounds/theme-purple.png",
                blue:   "images/backgrounds/theme-blue.png"
            };
            var theme = localStorage.getItem("reginaSelectedTheme") || "";
            var css = theme === "white"
                ? "background:#ffffff !important;"
                : "background-image:url('" + (THEME_IMAGES[theme] || THEME_IMAGES.pink) + "') !important;" +
                  "background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;";
            var style = document.createElement("style");
            style.textContent = "body{" + css + "}";
            document.head.appendChild(style);

            function preloadImage(href){
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "image";
                link.href = href;
                document.head.appendChild(link);
            }
            if(theme !== "white") preloadImage(THEME_IMAGES[theme] || THEME_IMAGES.pink);

            var introDone = localStorage.getItem("regina_intro_completed") === "true";
            preloadImage(introDone ? "images/dog/neutral.png" : "images/dog/sleeping.png");
        } catch(e){}
    })();
    </script>

    <!-- Рукописный шрифт с поддержкой кириллицы — для текста писем (карточка "на бумаге"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/puzzle.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/dialogue.css">
    <link rel="stylesheet" href="css/dog.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div class="top-actions">

        <button id="progressButton" class="top-action-btn" type="button" data-i18n="progress_panel_title" data-i18n-attr="aria-label,data-label" aria-label="Управление прогрессом" data-label="Прогресс">📈</button>
        <button id="musicBoxButton" class="side-widget side-widget--music top-action-btn" type="button" data-i18n="music_panel_title" data-i18n-attr="aria-label,data-label" aria-label="Музыкальная шкатулка" data-label="Музыкальная шкатулка">🎵</button>
        <button id="settingsButton" class="settings-button" type="button" data-i18n="static_settings_data_label" data-i18n-attr="aria-label,data-label" aria-label="Открыть настройки" data-label="Настройки">⚙️</button>
    </div>
    <div id="settingsPanel" class="settings-panel" data-i18n="static_settings_menu_aria" data-i18n-attr="aria-label" aria-label="Меню настроек"></div>
    <div id="progressPanel" class="settings-panel progress-panel" data-i18n="progress_panel_title" data-i18n-attr="aria-label" aria-label="Управление прогрессом"></div>
    <div id="musicPanel" class="settings-panel music-panel" data-i18n="music_panel_title" data-i18n-attr="aria-label" aria-label="Музыкальная шкатулка"></div>
    <div id="aboutPanel" class="settings-panel about-panel" data-i18n="about_panel_title" data-i18n-attr="aria-label" aria-label="О проекте"></div>
    <div id="lettersPanel" class="settings-panel letters-panel" data-i18n="letters_panel_title" data-i18n-attr="aria-label" aria-label="Письма"></div>
    <div id="characterContainer"></div>
    <div id="dialogueContainer"></div>

    <div class="container minimized" id="mainContainer">
        <button id="toggleContainer" class="toggle-btn">✕</button>
        <div class="background"></div>

        <div class="grid">
            <div class="piece locked" data-piece aria-label="Открыть часть 1">
                <div class="lock-wrap">
                    <div class="lock">&#128274;</div>
                    <div class="hint" data-i18n="static_piece_hint">Нажми, чтобы открыть</div>
                </div>
            </div>
            <div class="piece locked" data-piece aria-label="Открыть часть 2">
                <div class="lock-wrap">
                    <div class="lock">&#128274;</div>
                    <div class="hint" data-i18n="static_piece_hint">Нажми, чтобы открыть</div>
                </div>
            </div>
            <div class="piece locked" data-piece aria-label="Открыть часть 3">
                <div class="lock-wrap">
                    <div class="lock">&#128274;</div>
                    <div class="hint" data-i18n="static_piece_hint">Нажми, чтобы открыть</div>
                </div>
            </div>
            <div class="piece locked" data-piece aria-label="Открыть часть 4">
                <div class="lock-wrap">
                    <div class="lock">&#128274;</div>
                    <div class="hint" data-i18n="static_piece_hint">Нажми, чтобы открыть</div>
                </div>

    </div>

    <div id="progressIndicator" class="progress-indicator">0/4</div>
    <div class="footer" data-i18n="static_footer">Собери все части ✨</div>

    <div class="side-widgets" data-i18n="static_side_widgets_aria" data-i18n-attr="aria-label" aria-label="Боковые виджеты"></div>
    <div class="left-edge-icons" data-i18n="static_left_icons_aria" data-i18n-attr="aria-label" aria-label="Иконки по левому краю">
        <button id="lettersButton" class="side-widget left-edge-icon" type="button" data-i18n="letters_panel_title" data-i18n-attr="aria-label,data-label" aria-label="Письма" data-label="Письма">📬</button>
    </div>
    <div class="dog-side-icons" data-i18n="static_dog_side_icons_aria" data-i18n-attr="aria-label" aria-label="Иконки рядом с собакой">
        <button id="characterInfoButton" class="side-widget character-icon" type="button" aria-label="О персонаже" data-label="О персонаже">
            <span class="character-icon__emoji">🐾</span>
            <span class="character-icon__label" data-i18n="character_fallback_label">персонаж</span>
        </button>
        <button id="dogNameButton" class="side-widget character-icon" type="button" data-i18n="static_dog_name_aria" data-i18n-attr="aria-label" aria-label="Имя персонажа" data-label="Имя персонажа">
            <span class="character-icon__emoji">🐶</span>
            <span class="character-icon__label" data-i18n="character_fallback_label">персонаж</span>
        </button>
        <button id="diaryButton" class="side-widget" type="button" data-i18n="static_diary_aria" data-i18n-attr="aria-label,data-label" aria-label="Дневник проводника" data-label="Дневник">📓</button>
    </div>

    <div class="key-counter" id="keyCounter" type="button" aria-live="polite">🔑 0/1</div>

    <button id="resetPuzzle" class="reset-puzzle-btn" type="button" hidden data-i18n="puzzle_reset_test">Сбросить тест</button>
    <div id="puzzleToast" class="puzzle-toast" role="status" aria-live="polite"></div>

    <!-- Служебная тестовая панель ключей — скрыта, реальный способ получить
         ключ теперь через puzzleKeySystem.grantKey() из диалога собаки. -->
    <div class="key-test-panel" hidden>
        <button id="getTestKey" class="get-key-btn" type="button">Получить тестовый ключ</button>
        <div class="key-inventory" id="keyInventory">
            <button id="inventoryKeyButton" class="inventory-key" type="button" data-i18n="static_key_aria" data-i18n-attr="aria-label" aria-label="Ключ" aria-pressed="false" disabled>
                <span class="inventory-key-fallback">🔑</span>
                <img id="inventoryKeyImage" class="inventory-key-image" src="images/items/key.png" alt="">
            </button>
            <span class="inventory-label" data-i18n="static_key_aria">Ключ</span>
        </div>
    </div>

    <div id="keyConfirmModal" class="key-confirm-modal" hidden>
        <div class="key-confirm-card">
            <p data-i18n="static_key_confirm_text">Использовать ключ и открыть эту часть?</p>
            <div class="key-confirm-actions">
                <button id="cancelKeyUse" class="key-confirm-btn" type="button" data-i18n="static_cancel">Отмена</button>
                <button id="confirmKeyUse" class="key-confirm-btn key-confirm-btn--yes" type="button" data-i18n="static_open_btn">Открыть</button>
            </div>
        </div>
    </div>

    <div id="heldKeyCursor" class="held-key-cursor">
        <span class="held-key-fallback">🔑</span>
        <img src="images/items/key.png" alt="">
    </div>

    <!-- defer вместо обычной блокирующей загрузки: раньше браузер качал эти
         файлы ПО ОДНОМУ (каждый следующий запрос начинался только после
         того, как предыдущий полностью скачался И выполнился) — на медленной
         сети это могло растягиваться на секунды, и всё это время диалог не
         запускался, а собака стояла в исходной позе. defer заставляет их все
         качаться ПАРАЛЛЕЛЬНО, но выполняться по-прежнему строго по порядку
         (гарантия спецификации), так что все зависимости между файлами
         (например, i18n.js должен выполниться до settings.js) остаются
         рабочими без изменений — меняется только скорость загрузки. -->
    <script src="data/dialogues.js" defer></script>
    <script src="data/translations.js" defer></script>
    <script src="data/monthlyEvents.js" defer></script>
    <script src="data/gifts.js" defer></script>
    <script src="data/settings.js" defer></script>

    <!-- Движок переводов — до всех остальных js/*.js: js/ui/settings.js
         вызывает t() уже на верхнем уровне (при построении списков меню),
         поэтому t() должен существовать раньше, чем settings.js будет
         разобран браузером. -->
    <script src="js/i18n/i18n.js" defer></script>

    <script src="js/main.js" defer></script>
    <script src="js/puzzle/progress.js" defer></script>
    <script src="js/puzzle/keys.js" defer></script>
    <script src="js/puzzle/puzzle.js" defer></script>
    <script src="js/ui/window.js" defer></script>
    <script src="js/ui/settings.js" defer></script>
    <script src="js/storage/storage.js" defer></script>
    <script src="js/character/dog.js" defer></script>
    <script src="js/dialogue/dialogue.js" defer></script>
    <script src="js/ui/letters.js" defer></script>
    <script src="js/dev/devPanel.js" defer></script>
</body>
</html>
